# Redis configuration for TokenLite
# Basic configuration for production use

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
timeout 300
tcp-keepalive 60

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance
tcp-backlog 511
databases 16

# Security (uncomment and set a password in production)
# requirepass your_redis_password_here